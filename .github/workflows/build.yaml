name: Full Build

permissions:
  contents: write

on:
  push:
    branches: [ master ]
    tags: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get tag number from tag string
        id: tag_number
        if: ${{ startsWith( github.ref, 'refs/tags/' ) }}
        run: |
          orig_tag="${{ github.ref_name }}"
          echo "tag_number=${orig_tag/v/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          path: master

      - name: Checkout MonoBehaviour
        uses: actions/checkout@v7
        with:
          ref: MonoBehaviour
          path: MonoBehaviour

      - name: Checkout Unity
        uses: actions/checkout@v7
        with:
          ref: Unity
          path: Unity

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Setup MAPI
        uses: BadMagic100/setup-hk@v3
        with:
          apiPath: HkRefs
          dependencyFilePath: master/ModDependencies.txt

      - name: Install dependencies MonoBehaviour
        run: dotnet restore
        shell: bash
        working-directory: MonoBehaviour

      - name: Build MonoBehaviour
        run: dotnet build -c Release
        shell: bash
        working-directory: MonoBehaviour

      - name: Get git server API url
        id: git_server_url
        run: |
          if [ "${{ github.server_url }}" == "https://github.com" ]; then
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
            echo "url=https://api.github.com" >> $GITHUB_OUTPUT
            echo "runAsHost=false" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.USER_TOKEN }}" >> $GITHUB_OUTPUT
            echo "url=https://git.hk-modding.org/api/v1" >> $GITHUB_OUTPUT
            echo "runAsHost=true" >> $GITHUB_OUTPUT
          fi
        shell: bash
        working-directory: MonoBehaviour

      - name: Fetch SFCoreUnity for Unity project
        uses: GiaNTizmO/fetch-gitea-release-asset@master
        with:
          repo: 'SFGrenade/SFCore'
          file: 'SFCoreUnity.dll'
          target: 'Unity/Assets/Assemblies/SFCore.dll'
          token: ${{ steps.git_server_url.outputs.token }}
          octokitBaseUrl: ${{ steps.git_server_url.outputs.url }}

      - name: Build Unity
        uses: SFGrenade/build-unity@632e5d5e62df7b13a1a08a90b1f53d8307ace5a9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_NO_BANNER: "1"
          UNITY_NON_INTERACTIVE: "1"
          UNITY_NO_PAGER: "1"
          UNITY_NO_ELEVATE: "1"
          UNITY_NO_UPDATE_CHECK: "1"
          UNITY_NO_CRASH_REPORT: "1"
          UNITY_NO_CONSENT_PROMPT: "1"
        with:
          project-path: Unity
          build-target: windows
          build-method: CreateAssetBundles.BuildAllAssetBundlesCompressed

      - name: Build Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          projectPath: Unity
          buildsPath: Unity/build
          buildMethod: CreateAssetBundles.BuildAllAssetBundlesCompressed

      - name: Install dependencies master
        run: dotnet restore
        shell: bash
        working-directory: master

      - name: Build master
        run: dotnet build -c Release /p:AssemblyVersion=${{ steps.tag_number.outputs.tag_number }}
        shell: bash
        working-directory: master

      - name: Prepare master artifacts for release
        uses: christopherhx/gitea-upload-artifact@v7
        with:
          name: Publish-Master
          path: master/bin/Publish

  release:
    if: ${{ startsWith( github.ref, 'refs/tags/' ) }}
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: christopherhx/gitea-download-artifact@v8
        with:
          path: artifacts

      - name: Get build details
        id: details
        run: |
          sha="$(sed '4q;d' artifacts/Publish-Master/Ancinia/SHA.txt)"
          ver="${{ github.ref_name }}"
          echo "archiveHash=$sha" >> $GITHUB_OUTPUT
          echo "buildVersion=$ver" >> $GITHUB_OUTPUT
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.details.outputs.buildVersion }}
          body: |
            SHA256 of Ancinia.zip: ${{ steps.details.outputs.archiveHash }}  
            Attachments:  
            - Ancinia.zip
              - to be used for the ModInstaller
            - Ancinia.dll
              - the mod, also inside Ancinia.zip
          files: |
            artifacts/Publish-Master/Ancinia/Ancinia.zip
            artifacts/Publish-Master/Ancinia/Ancinia.dll
